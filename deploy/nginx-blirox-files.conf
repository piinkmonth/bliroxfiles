##
## Blirox Files — VPS reverse proxy
##
## drop in at /etc/nginx/conf.d/blirox-files.conf (or sites-available on debian).
##
## this replaces the cloudflare tunnel for files.example.com + us01.example.com.
## the home box keeps running `next start -p 4001` exactly as before — nothing in
## the app changes. traffic reaches it over tailscale:
##
##   browser --1Gbps--> vps nginx --tailscale--> home:4001
##
## set the upstream below to your home box's tailscale address (`tailscale ip -4`).
##

upstream blirox_home {
    # tailscale address of the home box. not a LAN address and not a public one —
    # if this is reachable from the internet, something is wrong.
    server YOUR_HOME_TS_IP:4001;

    # one upstream connection pool, kept warm. re-handshaking TCP to the home box
    # for every 64mb chunk would add a round trip per chunk.
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.example.com us01.example.com api.example.com;

    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    ##
    ## HTTP/1.1 ONLY — deliberate, and half the reason this proxy exists.
    ## do NOT add `http2` to these listen directives.
    ##
    ## the uploader fires six chunks in parallel (components/Uploader.tsx). over
    ## HTTP/2 those six PUTs multiplex onto ONE TCP connection and share ONE
    ## congestion window, so the parallelism buys nothing and packet loss
    ## head-of-line blocks all six at once. under HTTP/1.1 the browser opens six
    ## real connections with six independent congestion windows — which is where
    ## the throughput actually comes from.
    ##
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files.example.com us01.example.com api.example.com;

    # api.example.com is the dev api + docs. it must be a SAN on the cert below or
    # TLS to that host fails — reissue with all three names:
    #   certbot --nginx -d files.example.com -d us01.example.com -d api.example.com
    # the app handles the host itself (next rewrites in next.config.js); nothing
    # host-specific is needed here beyond proxying it like the others.
    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # the app sets its own security headers (next.config.js). dont duplicate them
    # here — two CSP headers get intersected by the browser and the stricter
    # accidental one wins.

    # 15gb files arrive as 64mb chunks, but BLIROX_CHUNK_MB can go up now that
    # cloudflare's 100mb cap is out of the path. generous, not unlimited: `0`
    # disables the check entirely and drops a cheap guard.
    client_max_body_size 512m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://blirox_home;
        proxy_http_version 1.1;

        ##
        ## stream request bodies straight through.
        ## without this nginx buffers each full 64mb chunk to the VPS disk BEFORE
        ## forwarding a byte — serialising every upload into "receive fully, then
        ## send" and adding a whole chunk of latency per request. also burns disk
        ## u might want for other things.
        ##
        proxy_request_buffering off;

        ##
        ## response buffering ON — the opposite of the request side above, dont
        ## confuse the two.
        ##
        ## `proxy_buffering off` was tried here and made downloads slow: with it
        ## off nginx never reads ahead, it pulls from the home box only as fast as
        ## the client drains, so the 46ms VPS↔home round trip lands in the
        ## critical path of every read instead of being pipelined, and any
        ## client-side stall stalls the upstream too.
        ## on, nginx reads ahead into the buffers below and serves the client
        ## independently, decoupling the slow high-latency upstream leg from
        ## delivery. thats what sustains throughput on bulk transfers.
        ## (the old "app already paces downloads so buffering only adds latency"
        ## reasoning was about time-to-first-byte, which doesnt matter for a file
        ## download.)
        ##
        proxy_buffering on;

        # ~4mb of read-ahead. at 46ms RTT that sustains well over the app's 9 MB/s
        # egress budget; the bandwidth-delay product at that rate is only ~414 KB.
        proxy_buffer_size       64k;
        proxy_buffers           64 64k;
        proxy_busy_buffers_size 512k;

        ##
        ## never spool responses to disk. past the in-memory buffers nginx would
        ## otherwise write the overflow to a temp file — for a 15gb download thats
        ## 15gb onto the VPS disk for no benefit, since the memory buffers already
        ## cover the latency this needs to hide. 0 keeps it all in RAM.
        ##
        proxy_max_temp_file_size 0;

        ##
        ## long timeouts, bc POST /api/upload/:id/complete is slow: it assembles
        ## ~240 chunks then SHA-256s the result on a spinning disk. for a 15gb file
        ## thats comfortably 10+ minutes of server work with no bytes flowing.
        ## nginx's 60s default would 504 on every large upload while the home box
        ## was still working — and the file lands fine, so it looks like a random
        ## intermittent failure. 3600s matches `export const maxDuration = 3600`
        ## on the route.
        ##
        proxy_connect_timeout 30s;
        proxy_send_timeout   3600s;
        proxy_read_timeout   3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        ##
        ## SECURITY — $remote_addr, NOT $proxy_add_x_forwarded_for.
        ## the usual `$proxy_add_x_forwarded_for` APPENDS the real peer to
        ## whatever the client already sent, giving "1.2.3.4, <real-ip>" when a
        ## client sends its own header. lib/auth.ts clientIp() reads
        ## `.split(',')[0]` — the attacker's value, not the real one. that
        ## ordering is right behind a trusted edge that overwrites the header
        ## (what cloudflare did); its wrong here. one proxy hop, so nginx replaces
        ## the header outright and position 0 is always the true peer.
        ## forging this would defeat the per-IP daily egress cap, the rate limiter
        ## and the audit trail.
        ##
        proxy_set_header X-Forwarded-For   $remote_addr;

        ##
        ## SECURITY — do not remove.
        ## clientIp() reads CF-Connecting-IP *first*, then falls back to
        ## X-Forwarded-For. right behind cloudflare (edge overwrites it), wrong
        ## here: nothing on this path sets it, so a client sending its own
        ## CF-Connecting-IP would have it trusted — forging the address used for
        ## rate limiting, the audit log and abuse reports. clearing it forces
        ## clientIp() onto X-Forwarded-For, which nginx controls above.
        ##
        proxy_set_header CF-Connecting-IP "";

        ##
        ## same class of problem: clientCountry() reads CF-IPCountry, which
        ## cloudflare resolved at the edge. absent here, so clear it to stop a
        ## client asserting its own country; clientCountry() then returns null,
        ## which it already treats as "couldnt resolve". new rows get a null
        ## country, nothing breaks. to get it back, build nginx with
        ## ngx_http_geoip2_module and set this from the maxmind country DB instead.
        ##
        proxy_set_header CF-IPCountry "";
    }
}
