##
## network tuning — install on BOTH the home box and the VPS.
##
##   sudo cp deploy/sysctl-99-blirox.conf /etc/sysctl.d/99-blirox.conf
##   sudo sysctl --system
##
## check: cat /proc/sys/net/core/rmem_max   (want 7500000, not 212992)
##

##
## UDP socket buffers — for cloudflared's QUIC transport.
##
## debian ships 212992 (208 KB). cloudflared speaks QUIC by default and quic-go
## cant raise this itself; it just logs "failed to sufficiently increase receive
## buffer size" and then quietly runs at a fraction of line rate.
##
## the home box is the RECEIVER for uploads, so this buffer sits right in the
## upload path. at 208 KB with a ~25 ms RTT to the cloudflare edge the
## bandwidth-delay product caps a connection near 8 MB/s no matter what the
## client's uplink can do. measured windows on this box were 161-277 KB across
## all four tunnel connections, with 54k+ packets dropped on one.
##
## 7.5 MB is cloudflare's own recommended value.
##
## still matters after the VPS proxy is live: the tunnel's other routes stay on
## it, and it's the fallback for files.example.com.
##
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

##
## TCP autotuning ceilings — min / default / max.
##
## raises the ceiling for the long-lived proxy connections between the VPS and
## the home box. the kernel autotunes within this range, so a big max costs
## nothing on idle connections.
##
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

##
## congestion control: cubic. do NOT switch this to BBR.
##
## BBR was tried on this path and measured worse. over a 20s, 4-stream iperf3
## run between the VPS and the home box:
##
##   cubic   97.2 Mbit/s delivered,     367 retransmits over 202 MB  (0.25%)
##   bbr     96.7 Mbit/s delivered,  13,118 retransmits over 246 MB  (7.4%)
##
## same throughput, 36x the retransmissions.
##
## the pitch for BBR is that cubic treats packet loss as congestion and backs
## off — a liability on a wired path with deep buffers. but this path is wifi, a
## shared half-duplex medium whose real capacity varies, and BBR's habit of
## probing past the available bandwidth without treating loss as a signal just
## parks it in permanent overshoot.
##
## on wifi thats actively harmful, not just wasteful — retransmitted frames burn
## airtime, and airtime spent retransmitting downloads is airtime the uploads
## (and every other device on the network) dont get.
##
## a short test will mislead u: the first ~3s of a BBR run show zero loss and
## ~150 Mbit/s bc thats startup, before it starts probing. measure the full 20s.
##
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = cubic
